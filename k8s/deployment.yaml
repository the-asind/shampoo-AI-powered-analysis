apiVersion: v1
kind: Secret
metadata:
  name: shampoo-openai
type: Opaque
stringData:
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_API_KEY: "replace-me"
  OPENAI_MODEL: "gpt-5.5"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shampoo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shampoo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shampoo
  template:
    metadata:
      labels:
        app: shampoo
    spec:
      containers:
        - name: app
          image: ghcr.io/your-org/shampoo-asind-dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: DATABASE_PATH
              value: /app/data/shampoo.sqlite
            - name: OPENAI_TIMEOUT_MS
              value: "12000"
          envFrom:
            - secretRef:
                name: shampoo-openai
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shampoo-data
---
apiVersion: v1
kind: Service
metadata:
  name: shampoo
spec:
  selector:
    app: shampoo
  ports:
    - name: http
      port: 80
      targetPort: 3000
